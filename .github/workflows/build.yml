name: Build edictbudget

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.bat'
      - '.github/workflows/build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: Edict_Budget

      - name: Clone HL2SDK (l4d2)
        run: git clone --depth 1 -b l4d2 https://github.com/alliedmodders/hl2sdk.git hl2sdk-l4d2

      - name: Clone Metamod:Source
        run: git clone --depth 1 --branch 1.12.0.1225 https://github.com/alliedmodders/metamod-source.git metamod-source

      - name: Create engine_wrappers.h
        working-directory: Edict_Budget\src
        shell: pwsh
        run: |
          @'
/**
 * vim: set ts=4 sw=4 tw=99 noet :
 * ======================================================
 * Metamod:Source Sample Plugin
 * Written by AlliedModders LLC.
 * ======================================================
 *
 * This software is provided 'as-is', without any express or implied warranty.
 * In no event will the authors be held liable for any damages arising from 
 * the use of this software.
 *
 * This sample plugin is public domain.
 */

#ifndef _INCLUDE_SOURCE_ENGINE_WRAPPERS_
#define _INCLUDE_SOURCE_ENGINE_WRAPPERS_

#include <eiface.h>

extern IVEngineServer *engine;
extern CGlobalVars *gpGlobals;

#if SOURCE_ENGINE == SE_EPISODEONE && defined METAMOD_PLAPI_VERSION
#error "Metamod:Source 1.6 API is not supported on the old engine."
#endif

#define ENGINE_CALL(func) SH_CALL(engine, &IVEngineServer::func)

/**
 * Wrap some API calls for legacy MM:S.
 */
#if !defined METAMOD_PLAPI_VERSION
#define GetEngineFactory engineFactory
#define GetServerFactory serverFactory
#define MM_Format snprintf
#define	GetCGlobals	pGlobals
#else
#define MM_Format g_SMAPI->Format
#endif

#if SOURCE_ENGINE <= SE_DARKMESSIAH
/**
 * Wrap the CCommand class so our code looks the same on all engines.
 */
class CCommand
{
public:
	const char *ArgS()
	{
		return engine->Cmd_Args();
	}
	int ArgC()
	{
		return engine->Cmd_Argc();
	}

	const char *Arg(int index)
	{
		return engine->Cmd_Argv(index);
	}
};

#define CVAR_INTERFACE_VERSION VENGINE_CVAR_INTERFACE_VERSION
#endif

/**
 * Left 4 Dead engine removed these from IVEngineServer.
 */
#if SOURCE_ENGINE >= SE_LEFT4DEAD

inline int IndexOfEdict(const edict_t *pEdict)
{
	return (int)(pEdict - gpGlobals->pEdicts);
}
inline edict_t *PEntityOfEntIndex(int iEntIndex)
{
	if (iEntIndex >= 0 && iEntIndex < gpGlobals->maxEntities)
	{
		return (edict_t *)(gpGlobals->pEdicts + iEntIndex);
	}
	return NULL;
}

#else

inline int IndexOfEdict(const edict_t *pEdict)
{
	return engine->IndexOfEdict(pEdict);
}
inline edict_t *PEntityOfEntIndex(int iEntIndex)
{
	return engine->PEntityOfEntIndex(iEntIndex);
}

#endif

#endif //_INCLUDE_SOURCE_ENGINE_WRAPPERS_
'@ | Set-Content -Path engine_wrappers.h -Encoding ASCII

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build (MSVC x86)
        working-directory: Edict_Budget\src
        run: |
          set HL2SDK=%GITHUB_WORKSPACE%\hl2sdk-l4d2
          set MMSOURCE=%GITHUB_WORKSPACE%\metamod-source
          set INCLUDES=/I "%HL2SDK%\public" /I "%HL2SDK%\public\engine" /I "%HL2SDK%\public\tier0" /I "%HL2SDK%\public\tier1" /I "%HL2SDK%\public\vstdlib" /I "%HL2SDK%\public\mathlib" /I "%HL2SDK%\public\game\server" /I "%MMSOURCE%\core" /I "%MMSOURCE%\core\sourcehook"
          set DEFINES=/D "WIN32" /D "_WINDOWS" /D "COMPILER_MSVC" /D "COMPILER_MSVC32" /D "SE_LEFT4DEAD2=16" /D "SOURCE_ENGINE=16"
          cl.exe /MT /O2 /Zi /LD /EHsc %DEFINES% %INCLUDES% sample_mm.cpp "%HL2SDK%\lib\public\tier0.lib" "%HL2SDK%\lib\public\tier1.lib" "%HL2SDK%\lib\public\vstdlib.lib" /link /OUT:edictbudget_mm.dll /DEBUG /OPT:REF /OPT:ICF /MAP

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: edictbudget_mm-windows
          path: Edict_Budget/src/edictbudget_mm.dll
